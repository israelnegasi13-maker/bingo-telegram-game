<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bots Command Center · ETHIO GAMES</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0c10;
      color: #e9edf5;
      line-height: 1.5;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header h1 i {
      background: #1e293b;
      padding: 0.5rem;
      border-radius: 14px;
      color: #3b82f6;
      font-size: 1.5rem;
    }

    .badge {
      background: #1e293b;
      color: #94a3b8;
      padding: 0.25rem 0.75rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      border: 1px solid #334155;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: #131b26;
      border: 1px solid #263241;
      border-radius: 20px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }

    .stat-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: white;
      line-height: 1.2;
    }

    .stat-detail {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }

    /* Action Bar */
    .action-bar {
      background: #131b26;
      border: 1px solid #263241;
      border-radius: 20px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
    }

    .action-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }

    .divider {
      width: 1px;
      height: 30px;
      background: #263241;
      margin: 0 0.5rem;
    }

    .btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .btn i {
      font-size: 1rem;
      color: #94a3b8;
    }

    .btn-primary {
      background: #2563eb;
      border-color: #3b82f6;
      color: white;
    }
    .btn-primary i { color: white; }
    .btn-primary:hover { background: #3b82f6; }

    .btn-success {
      background: #0f766e;
      border-color: #14b8a6;
    }
    .btn-success:hover { background: #14b8a6; }

    .btn-warning {
      background: #b45309;
      border-color: #d97706;
    }
    .btn-warning:hover { background: #d97706; }

    .btn-outline {
      background: transparent;
    }
    .btn-outline:hover { background: #1e293b; }

    .btn:active { transform: translateY(1px); }

    .search-box {
      flex: 1;
      min-width: 260px;
      display: flex;
      align-items: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 40px;
      padding: 0.3rem 0.3rem 0.3rem 1.2rem;
    }
    .search-box i {
      color: #94a3b8;
      font-size: 1rem;
    }
    .search-box input {
      background: transparent;
      border: none;
      padding: 0.5rem 0.8rem;
      color: white;
      width: 100%;
      outline: none;
      font-size: 0.95rem;
    }
    .search-box input::placeholder { color: #5f6c80; }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      background: #1e293b;
      border-left: 4px solid;
      border-radius: 12px;
      padding: 1rem 1.5rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      min-width: 280px;
      display: flex;
      align-items: center;
      gap: 1rem;
      animation: slideIn 0.3s ease;
    }
    .toast.success { border-color: #10b981; }
    .toast.error { border-color: #ef4444; }
    .toast.info { border-color: #3b82f6; }
    .toast i { font-size: 1.2rem; }
    .toast.success i { color: #10b981; }
    .toast.error i { color: #ef4444; }
    .toast.info i { color: #3b82f6; }
    .toast-close {
      margin-left: auto;
      cursor: pointer;
      color: #94a3b8;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Table */
    .table-container {
      background: #131b26;
      border: 1px solid #263241;
      border-radius: 24px;
      overflow-x: auto;
      box-shadow: 0 15px 30px -10px #00000080;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1000px;
    }

    th {
      text-align: left;
      padding: 1.2rem 1rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      background: #1a2533;
      border-bottom: 1px solid #263241;
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid #1f2a36;
      color: #e2e8f0;
      font-size: 0.95rem;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1c2735; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.25rem 0.8rem;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      width: fit-content;
    }
    .status-active {
      background: #0a3622;
      color: #4ade80;
      border: 1px solid #22c55e;
    }
    .status-inactive {
      background: #3b1c1c;
      color: #f87171;
      border: 1px solid #ef4444;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .action-icon {
      background: #1f2a39;
      border: none;
      color: #cbd5e1;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.15s;
      font-size: 0.9rem;
    }
    .action-icon:hover { background: #2d3a4c; color: white; }
    .action-icon.save { background: #0f766e; color: white; }
    .action-icon.send { background: #2563eb; color: white; }
    .action-icon.danger:hover { background: #991b1b; color: white; }

    .inline-input {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.4rem 0.6rem;
      color: white;
      width: 100px;
      font-size: 0.85rem;
    }
    .inline-input:focus {
      outline: 2px solid #3b82f6;
      border-color: transparent;
    }

    .balance-value {
      font-weight: 600;
      color: #fbbf24;
    }

    .empty-row td {
      text-align: center;
      padding: 3rem;
      color: #5f6c80;
      font-style: italic;
    }

    .loading {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid #94a3b8;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 700px) {
      body { padding: 0.8rem; }
      .header h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>
      <i class="fas fa-robot"></i> Bots Command Center
    </h1>
    <div class="badge" id="connectionStatus">
      <i class="fas fa-circle" style="color: #f59e0b;"></i> Connecting...
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card">
      <div class="stat-label"><i class="fas fa-robot"></i> Total bots</div>
      <div class="stat-value" id="statTotalBots">0</div>
      <div class="stat-detail">registered</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><i class="fas fa-circle-check"></i> Active</div>
      <div class="stat-value" id="statActiveBots">0</div>
      <div class="stat-detail">online & ready</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><i class="fas fa-coins"></i> Total balance</div>
      <div class="stat-value" id="statTotalBalance">0</div>
      <div class="stat-detail">ETB</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><i class="fas fa-door-open"></i> In rooms</div>
      <div class="stat-value" id="statInRooms">0</div>
      <div class="stat-detail">currently playing</div>
    </div>
  </div>

  <!-- Action Bar -->
  <div class="action-bar">
    <div class="action-group">
      <input type="text" id="newBotName" class="inline-input" placeholder="Bot name" style="width:160px;">
      <button class="btn btn-primary" onclick="addNewBot()"><i class="fas fa-plus-circle"></i> Add bot</button>
    </div>
    <div class="divider"></div>
    <div class="action-group">
      <button class="btn btn-success" onclick="confirmBulkActivate(true)"><i class="fas fa-check-circle"></i> Activate all</button>
      <button class="btn btn-warning" onclick="confirmBulkActivate(false)"><i class="fas fa-ban"></i> Deactivate all</button>
      <button class="btn btn-outline" onclick="addFundsToAll()"><i class="fas fa-gift"></i> +1000 to all</button>
    </div>
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Filter by name or ID..." onkeyup="filterBots()">
    </div>
    <button class="btn btn-outline" onclick="refreshBots()"><i class="fas fa-sync-alt"></i> Refresh</button>
  </div>

  <!-- Bots Table -->
  <div class="table-container">
    <table id="botsTable">
      <thead>
        <tr>
          <th>Bot ID</th>
          <th>Name</th>
          <th>Balance (ETB)</th>
          <th>Status</th>
          <th>Room / Box</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="botsTableBody">
        <tr class="empty-row"><td colspan="6"><i class="fas fa-spinner fa-pulse"></i> Loading bots...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  (function() {
    // ---------- Socket & State ----------
    const socket = io();
    let authenticated = false;
    let botsList = [];
    let filteredBots = [];

    // UI Elements
    const connectionStatus = document.getElementById('connectionStatus');
    const toastContainer = document.getElementById('toastContainer');

    // ---------- Helper: Show Toast ----------
    function showToast(message, type = 'info', duration = 4000) {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icon = type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-circle-exclamation' : 'fa-info-circle');
      toast.innerHTML = `
        <i class="fas ${icon}"></i>
        <span>${message}</span>
        <i class="fas fa-times toast-close" onclick="this.parentElement.remove()"></i>
      `;
      toastContainer.appendChild(toast);
      setTimeout(() => toast.remove(), duration);
    }

    // ---------- Socket Events ----------
    socket.on('connect', () => {
      connectionStatus.innerHTML = '<i class="fas fa-circle" style="color:#10b981;"></i> Connected';
      socket.emit('admin:auth', 'passwordless');
    });

    socket.on('disconnect', () => {
      connectionStatus.innerHTML = '<i class="fas fa-circle" style="color:#ef4444;"></i> Disconnected';
      authenticated = false;
    });

    socket.on('admin:authSuccess', () => {
      authenticated = true;
      showToast('Authentication successful', 'success');
      refreshBots();
    });

    socket.on('admin:authError', (err) => {
      showToast('Authentication failed: ' + (err || 'Unknown error'), 'error');
      // Retry after 3 seconds
      setTimeout(() => socket.emit('admin:auth', 'passwordless'), 3000);
    });

    socket.on('admin:botsList', (bots) => {
      botsList = bots;
      filterBots();
      updateStats(bots);
    });

    socket.on('admin:error', (msg) => {
      showToast('Server error: ' + msg, 'error');
    });

    socket.on('admin:success', (msg) => {
      showToast(msg, 'success');
    });

    socket.on('admin:botFundsAdded', (result) => {
      showToast(`Funds added, new balance: ${result.newBalance.toFixed(2)} ETB`, 'success');
    });

    // ---------- Stats Update ----------
    function updateStats(bots) {
      const total = bots.length;
      const active = bots.filter(b => b.active).length;
      const totalBalance = bots.reduce((acc, b) => acc + (Number(b.balance) || 0), 0).toFixed(2);
      const inRooms = bots.filter(b => b.currentRoom).length;

      document.getElementById('statTotalBots').innerText = total;
      document.getElementById('statActiveBots').innerText = active;
      document.getElementById('statTotalBalance').innerText = totalBalance;
      document.getElementById('statInRooms').innerText = inRooms;
    }

    // ---------- Filter & Render ----------
    function filterBots() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      filteredBots = query
        ? botsList.filter(bot => bot.userId.toLowerCase().includes(query) || bot.userName.toLowerCase().includes(query))
        : botsList;
      renderBotsTable(filteredBots);
    }

    function renderBotsTable(bots) {
      const tbody = document.getElementById('botsTableBody');
      if (!bots || bots.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="6">🤖 No bots found. Create one!</td></tr>';
        return;
      }

      let html = '';
      bots.forEach(bot => {
        const statusClass = bot.active ? 'status-active' : 'status-inactive';
        const statusText = bot.active ? 'Active' : 'Inactive';
        const roomInfo = bot.currentRoom ? `${bot.currentRoom} ETB / Box ${bot.box}` : '—';
        const balance = Number(bot.balance).toFixed(2);

        html += `
          <tr id="row-${bot.userId}">
            <td><code>${bot.userId}</code></td>
            <td>
              <span id="name-${bot.userId}">${bot.userName}</span>
              <input type="text" id="rename-${bot.userId}" class="inline-input" value="${bot.userName}" style="display:none;">
            </td>
            <td>
              <span id="balance-${bot.userId}" class="balance-value">${balance}</span>
              <input type="number" id="funds-${bot.userId}" class="inline-input" placeholder="Amount" style="display:none; width:80px;">
            </td>
            <td><span class="status-badge ${statusClass}"><i class="fas fa-circle" style="font-size: 0.5rem;"></i> ${statusText}</span></td>
            <td>${roomInfo}</td>
            <td class="actions">
              <!-- Rename -->
              <button class="action-icon" onclick="toggleRename('${bot.userId}')" title="Rename"><i class="fas fa-pen"></i></button>
              <button class="action-icon save" id="save-${bot.userId}" onclick="saveRename('${bot.userId}')" style="display:none;" title="Save name"><i class="fas fa-check"></i></button>
              <!-- Add Funds -->
              <button class="action-icon" onclick="toggleAddFunds('${bot.userId}')" title="Add funds"><i class="fas fa-coins"></i></button>
              <button class="action-icon send" id="addBtn-${bot.userId}" onclick="addFunds('${bot.userId}')" style="display:none;" title="Send"><i class="fas fa-paper-plane"></i></button>
              <!-- Activate/Deactivate -->
              <button class="action-icon" onclick="setActive('${bot.userId}', ${!bot.active})" title="${bot.active ? 'Deactivate' : 'Activate'}">
                <i class="fas ${bot.active ? 'fa-toggle-on' : 'fa-toggle-off'}"></i>
              </button>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    // ---------- Action Functions (Emit Socket Events) ----------
    window.toggleRename = function(botId) {
      document.getElementById(`name-${botId}`).style.display = 'none';
      document.getElementById(`rename-${botId}`).style.display = 'inline-block';
      document.getElementById(`save-${botId}`).style.display = 'inline-flex';
    };

    window.saveRename = function(botId) {
      const newName = document.getElementById(`rename-${botId}`).value;
      if (!newName.trim()) return showToast('Name cannot be empty', 'error');
      socket.emit('admin:renameBot', { botId, newName });
      document.getElementById(`name-${botId}`).textContent = newName;
      document.getElementById(`name-${botId}`).style.display = 'inline';
      document.getElementById(`rename-${botId}`).style.display = 'none';
      document.getElementById(`save-${botId}`).style.display = 'none';
    };

    window.toggleAddFunds = function(botId) {
      document.getElementById(`funds-${botId}`).style.display = 'inline-block';
      document.getElementById(`addBtn-${botId}`).style.display = 'inline-flex';
    };

    window.addFunds = function(botId) {
      const amount = parseFloat(document.getElementById(`funds-${botId}`).value);
      if (isNaN(amount) || amount <= 0) return showToast('Enter a positive amount', 'error');
      socket.emit('admin:addBotFunds', { botId, amount });
      document.getElementById(`funds-${botId}`).style.display = 'none';
      document.getElementById(`addBtn-${botId}`).style.display = 'none';
    };

    window.setActive = function(botId, active) {
      socket.emit('admin:setBotActive', { botId, active });
    };

    window.addNewBot = function() {
      const name = document.getElementById('newBotName').value.trim() || undefined;
      socket.emit('admin:addNewBot', { name });
      document.getElementById('newBotName').value = '';
    };

    // Bulk actions with confirmation
    window.confirmBulkActivate = function(active) {
      const action = active ? 'activate' : 'deactivate';
      if (!confirm(`Are you sure you want to ${action} ALL bots?`)) return;
      botsList.forEach(bot => {
        if (bot.active !== active) {
          socket.emit('admin:setBotActive', { botId: bot.userId, active });
        }
      });
    };

    window.addFundsToAll = function() {
      if (!confirm('Add 1000 ETB to ALL bots?')) return;
      botsList.forEach(bot => {
        socket.emit('admin:addBotFunds', { botId: bot.userId, amount: 1000 });
      });
    };

    window.filterBots = filterBots;
    window.refreshBots = function() {
      if (!authenticated) {
        showToast('Not authenticated, please wait...', 'error');
        return;
      }
      socket.emit('admin:getBotsList');
    };

    // Auto‑refresh every 30 seconds
    setInterval(() => {
      if (authenticated) socket.emit('admin:getBotsList');
    }, 30000);
  })();
</script>
</body>
</html>
