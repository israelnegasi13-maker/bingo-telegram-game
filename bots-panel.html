<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BOTS ELITE · COMMAND CENTER</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 20% 30%, #0c1420, #020408);
      min-height: 100vh;
      padding: 1.5rem;
      color: #f0f4fa;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Glass header */
    .glass-header {
      background: rgba(10, 20, 30, 0.6);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 40px;
      padding: 1rem 2rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: 0 20px 40px -10px #00000080;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo i {
      font-size: 2rem;
      background: linear-gradient(135deg, #3b82f6, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px #3b82f6);
    }

    .logo h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(to right, #b3d9ff, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .connection-badge {
      background: #1a2938;
      padding: 0.5rem 1.5rem;
      border-radius: 40px;
      border: 1px solid #3b82f6;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 0 15px #3b82f640;
    }

    /* Stats cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: rgba(15, 25, 35, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid #2d4055;
      border-radius: 28px;
      padding: 1.5rem 1.2rem;
      box-shadow: 0 12px 28px -8px black;
      transition: 0.2s;
    }

    .stat-card:hover {
      border-color: #3b82f6;
      transform: translateY(-4px);
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8fadc9;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 800;
      color: white;
      line-height: 1.1;
      text-shadow: 0 2px 5px #00000060;
    }

    .stat-detail {
      font-size: 0.8rem;
      color: #6f8cac;
      margin-top: 0.3rem;
    }

    /* Control bar */
    .control-bar {
      background: rgba(8, 16, 24, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid #2a4055;
      border-radius: 50px;
      padding: 0.8rem 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 1.5rem;
    }

    .control-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      background: #1f3142;
      border: 1px solid #3a506b;
      color: #e2eaf3;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 4px 12px #00000030;
    }

    .btn i { font-size: 1rem; color: #7f9bc0; }
    .btn-primary { background: #2563eb; border-color: #4b8bff; color: white; }
    .btn-primary i { color: white; }
    .btn-primary:hover { background: #3b82f6; }
    .btn-success { background: #0b6b5e; border-color: #1e9b87; }
    .btn-success:hover { background: #14b8a6; }
    .btn-warning { background: #b45309; border-color: #ea9b3e; }
    .btn-warning:hover { background: #d97706; }
    .btn-outline { background: transparent; }
    .btn-outline:hover { background: #1f3142; }

    .search-wrapper {
      flex: 1;
      min-width: 240px;
      display: flex;
      align-items: center;
      background: #0e1a26;
      border: 1px solid #2d4057;
      border-radius: 40px;
      padding: 0.2rem 0.2rem 0.2rem 1.2rem;
    }
    .search-wrapper i { color: #6f8cac; }
    .search-wrapper input {
      background: transparent;
      border: none;
      padding: 0.6rem 0.8rem;
      color: white;
      width: 100%;
      outline: none;
      font-size: 0.95rem;
    }
    .search-wrapper input::placeholder { color: #4a607a; }

    /* Bots grid */
    .bots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .bot-card {
      background: rgba(18, 28, 38, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid #2d4057;
      border-radius: 30px;
      padding: 1.5rem;
      box-shadow: 0 20px 30px -12px black;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .bot-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #3b82f6, #a855f7, #ec4899);
      opacity: 0.8;
    }

    .bot-card:hover {
      border-color: #3b82f6;
      transform: scale(1.02);
      box-shadow: 0 30px 40px -10px #1e3a8a;
    }

    .bot-avatar {
      width: 56px;
      height: 56px;
      background: linear-gradient(145deg, #1e3a5f, #0f2b44);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 600;
      color: #a5d8ff;
      border: 2px solid #3b82f6;
      box-shadow: 0 0 15px #3b82f6;
    }

    .bot-info {
      flex: 1;
      margin-left: 1rem;
    }

    .bot-name {
      font-weight: 700;
      font-size: 1.2rem;
    }
    .bot-id {
      font-size: 0.7rem;
      color: #7f9bc0;
      font-family: monospace;
    }

    .balance-box {
      background: #0d1a26;
      border-radius: 30px;
      padding: 0.5rem 1rem;
      margin: 1rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #2e5775;
    }
    .balance-amount {
      font-weight: 700;
      color: #fbbf24;
      font-size: 1.2rem;
    }
    .room-badge {
      background: #1c3f5c;
      border-radius: 30px;
      padding: 0.2rem 1rem;
      font-size: 0.75rem;
      color: #8fc9ff;
      border: 1px solid #3b82f6;
      display: inline-block;
    }

    .status-badge {
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      display: inline-block;
    }
    .status-active { background: #0a3f2b; color: #6fcf97; border: 1px solid #27ae60; }
    .status-inactive { background: #441e1e; color: #f29091; border: 1px solid #eb5757; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #1a2938;
      border: 1px solid #3b82f6;
      border-radius: 40px;
      padding: 2rem;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 30px 50px -20px black;
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .modal-avatar {
      width: 60px;
      height: 60px;
      background: linear-gradient(145deg, #1e3a5f, #0f2b44);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 600;
      color: #a5d8ff;
      border: 2px solid #3b82f6;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.8rem;
      color: #8fadc9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      background: #0e1a26;
      border: 1px solid #2d4057;
      border-radius: 30px;
      padding: 0.7rem 1.2rem;
      color: white;
      font-size: 1rem;
      outline: none;
    }
    .form-input:focus {
      border-color: #3b82f6;
    }

    .toggle-switch {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .toggle-switch button {
      background: #1f3142;
      border: 1px solid #3a506b;
      color: white;
      padding: 0.5rem 1.5rem;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .toggle-switch button.active {
      background: #2563eb;
      border-color: #3b82f6;
    }

    .modal-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .modal-actions .btn {
      flex: 1;
      justify-content: center;
    }

    /* Toast */
    .toast-stack {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1001;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      background: #1f2c3b;
      border-left: 6px solid;
      border-radius: 20px;
      padding: 1rem 1.5rem;
      box-shadow: 0 20px 30px -10px black;
      min-width: 280px;
      display: flex;
      align-items: center;
      gap: 1rem;
      backdrop-filter: blur(10px);
      animation: slideInRight 0.3s ease;
    }
    .toast.success { border-color: #10b981; }
    .toast.error { border-color: #ef4444; }
    .toast.info { border-color: #3b82f6; }
    .toast i { font-size: 1.2rem; }
    .toast.success i { color: #10b981; }
    .toast.error i { color: #ef4444; }
    .toast.info i { color: #3b82f6; }
    .toast-close {
      margin-left: auto;
      cursor: pointer;
      color: #9caec9;
    }
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .loading-skeleton {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem;
      color: #4d688b;
    }
    .fa-spinner { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem;
      background: rgba(15, 25, 35, 0.7);
      border-radius: 40px;
      color: #6f8cac;
      border: 2px dashed #2d4b68;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Glass Header -->
  <div class="glass-header">
    <div class="logo">
      <i class="fas fa-microchip"></i>
      <h1>BOTS ELITE</h1>
    </div>
    <div class="connection-badge" id="connectionStatus">
      <i class="fas fa-circle" style="color: #f59e0b;"></i> Connecting...
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="stat-label"><i class="fas fa-robot"></i> Total bots</div><div class="stat-value" id="statTotalBots">0</div><div class="stat-detail">registered</div></div>
    <div class="stat-card"><div class="stat-label"><i class="fas fa-check-circle"></i> Active</div><div class="stat-value" id="statActiveBots">0</div><div class="stat-detail">ready</div></div>
    <div class="stat-card"><div class="stat-label"><i class="fas fa-coins"></i> Total balance</div><div class="stat-value" id="statTotalBalance">0</div><div class="stat-detail">ETB</div></div>
    <div class="stat-card"><div class="stat-label"><i class="fas fa-door-open"></i> In rooms</div><div class="stat-value" id="statInRooms">0</div><div class="stat-detail">playing</div></div>
  </div>

  <!-- Control Bar -->
  <div class="control-bar">
    <div class="control-group">
      <input type="text" id="newBotName" class="form-input" placeholder="Bot name" style="width:160px;">
      <button class="btn btn-primary" onclick="addNewBot()"><i class="fas fa-plus-circle"></i> Add bot</button>
    </div>
    <div class="control-group">
      <button class="btn btn-success" onclick="bulkActivate(true)"><i class="fas fa-power-off"></i> Activate all</button>
      <button class="btn btn-warning" onclick="bulkActivate(false)"><i class="fas fa-power-off"></i> Deactivate all</button>
      <button class="btn btn-outline" onclick="bulkAddFunds(1000)"><i class="fas fa-gift"></i> +1000 to all</button>
    </div>
    <div class="search-wrapper">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Filter by name or ID..." oninput="filterBots()">
    </div>
    <button class="btn btn-outline" onclick="refreshBots()"><i class="fas fa-sync-alt"></i> Refresh</button>
  </div>

  <!-- Bots Grid -->
  <div id="botsGridContainer">
    <div class="loading-skeleton" id="loadingIndicator">
      <i class="fas fa-spinner"></i> &nbsp; Loading bots...
    </div>
    <div class="bots-grid" id="botsGrid" style="display: none;"></div>
  </div>
</div>

<!-- Modal Overlay -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="botModal">
    <div class="modal-header">
      <div class="modal-avatar" id="modalAvatar">B</div>
      <div class="modal-title" id="modalTitle">Bot Name</div>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Rename</label>
        <input type="text" id="modalRenameInput" class="form-input" placeholder="New name">
      </div>
      <div class="form-group">
        <label>Add funds (ETB)</label>
        <input type="number" id="modalAddFundsInput" class="form-input" placeholder="Amount" min="1" step="any">
      </div>
      <div class="form-group">
        <label>Status</label>
        <div class="toggle-switch">
          <button id="modalActivateBtn" class="active" onclick="setModalActive(true)">Active</button>
          <button id="modalDeactivateBtn" onclick="setModalActive(false)">Inactive</button>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="saveModalChanges()"><i class="fas fa-save"></i> Save</button>
      <button class="btn btn-outline" onclick="closeModal()"><i class="fas fa-times"></i> Cancel</button>
    </div>
  </div>
</div>

<!-- Toast Stack -->
<div class="toast-stack" id="toastStack"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  (function() {
    // ---------- STATE ----------
    const socket = io();
    let authenticated = false;
    let botsList = [];
    let filteredBots = [];
    let currentBot = null;

    // DOM elements
    const connectionStatus = document.getElementById('connectionStatus');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const botsGrid = document.getElementById('botsGrid');
    const toastStack = document.getElementById('toastStack');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalAvatar = document.getElementById('modalAvatar');
    const modalTitle = document.getElementById('modalTitle');
    const modalRenameInput = document.getElementById('modalRenameInput');
    const modalAddFundsInput = document.getElementById('modalAddFundsInput');
    const modalActivateBtn = document.getElementById('modalActivateBtn');
    const modalDeactivateBtn = document.getElementById('modalDeactivateBtn');

    // Stats elements
    const statTotalBots = document.getElementById('statTotalBots');
    const statActiveBots = document.getElementById('statActiveBots');
    const statTotalBalance = document.getElementById('statTotalBalance');
    const statInRooms = document.getElementById('statInRooms');

    // ---------- HELPERS ----------
    function showToast(message, type = 'info', duration = 4000) {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icon = type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-circle-exclamation' : 'fa-info-circle');
      toast.innerHTML = `
        <i class="fas ${icon}"></i>
        <span>${message}</span>
        <i class="fas fa-times toast-close" onclick="this.parentElement.remove()"></i>
      `;
      toastStack.appendChild(toast);
      setTimeout(() => toast.remove(), duration);
    }

    function updateStats(bots) {
      const total = bots.length;
      const active = bots.filter(b => b.active).length;
      const totalBal = bots.reduce((acc, b) => acc + (Number(b.balance) || 0), 0).toFixed(2);
      const inRooms = bots.filter(b => b.currentRoom).length;
      statTotalBots.innerText = total;
      statActiveBots.innerText = active;
      statTotalBalance.innerText = totalBal;
      statInRooms.innerText = inRooms;
    }

    // ---------- RENDER GRID (with click handler attached via JS) ----------
    function renderBotsGrid(bots) {
      botsGrid.style.display = 'grid';
      loadingIndicator.style.display = 'none';

      if (!bots || bots.length === 0) {
        botsGrid.innerHTML = '<div class="empty-state"><i class="fas fa-robot" style="font-size:3rem; opacity:0.4;"></i><br>No bots found. Create one!</div>';
        return;
      }

      let html = '';
      bots.forEach(bot => {
        const balance = Number(bot.balance).toFixed(2);
        const statusClass = bot.active ? 'status-active' : 'status-inactive';
        const statusText = bot.active ? 'Active' : 'Inactive';
        const roomInfo = bot.currentRoom ? `<span class="room-badge"><i class="fas fa-door-open"></i> ${bot.currentRoom} ETB / Box ${bot.box}</span>` : '<span class="room-badge">—</span>';
        const avatarLetter = bot.userName.charAt(0).toUpperCase();

        html += `
          <div class="bot-card" data-userid="${bot.userId}">
            <div style="display: flex; align-items: center; margin-bottom: 0.5rem;">
              <div class="bot-avatar">${avatarLetter}</div>
              <div class="bot-info">
                <div class="bot-name">${bot.userName}</div>
                <div class="bot-id">${bot.userId}</div>
              </div>
            </div>
            <div class="balance-box">
              <span><i class="fas fa-coins" style="color:#fbbf24;"></i> Balance</span>
              <span class="balance-amount">${balance} ETB</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span class="status-badge ${statusClass}">${statusText}</span>
              ${roomInfo}
            </div>
          </div>
        `;
      });
      botsGrid.innerHTML = html;

      // Attach click listeners to each card
      document.querySelectorAll('.bot-card').forEach(card => {
        card.addEventListener('click', () => {
          const userId = card.dataset.userid;
          openModal(userId);
        });
      });
    }

    // ---------- FILTER ----------
    function filterBots() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      filteredBots = query
        ? botsList.filter(bot => bot.userId.toLowerCase().includes(query) || bot.userName.toLowerCase().includes(query))
        : botsList;
      renderBotsGrid(filteredBots);
    }

    // ---------- MODAL ----------
    function openModal(botId) {
      const bot = botsList.find(b => b.userId === botId);
      if (!bot) {
        console.error('Bot not found:', botId);
        return;
      }
      currentBot = bot;
      modalAvatar.innerText = bot.userName.charAt(0).toUpperCase();
      modalTitle.innerText = bot.userName;
      modalRenameInput.value = bot.userName;
      modalAddFundsInput.value = '';
      setModalActiveUI(bot.active);
      modalOverlay.classList.add('active');
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      currentBot = null;
    }

    function setModalActive(active) {
      if (!currentBot) return;
      setModalActiveUI(active);
    }

    function setModalActiveUI(active) {
      if (active) {
        modalActivateBtn.classList.add('active');
        modalDeactivateBtn.classList.remove('active');
      } else {
        modalActivateBtn.classList.remove('active');
        modalDeactivateBtn.classList.add('active');
      }
    }

    function saveModalChanges() {
      if (!currentBot) return;
      const newName = modalRenameInput.value.trim();
      const funds = parseFloat(modalAddFundsInput.value);
      const newActive = modalActivateBtn.classList.contains('active');

      // Rename if changed
      if (newName && newName !== currentBot.userName) {
        socket.emit('admin:renameBot', { botId: currentBot.userId, newName });
        // Optimistic update
        currentBot.userName = newName;
      }

      // Add funds if valid
      if (!isNaN(funds) && funds > 0) {
        socket.emit('admin:addBotFunds', { botId: currentBot.userId, amount: funds });
      }

      // Change active status if different
      if (newActive !== currentBot.active) {
        socket.emit('admin:setBotActive', { botId: currentBot.userId, active: newActive });
        currentBot.active = newActive;
      }

      closeModal();
      showToast('Changes saved', 'success');
      refreshBots(); // refresh to get updated data
    }

    // ---------- ADD NEW BOT ----------
    function addNewBot() {
      const name = document.getElementById('newBotName').value.trim();
      socket.emit('admin:addNewBot', { name: name || undefined });
      document.getElementById('newBotName').value = '';
    }

    // ---------- BULK ACTIONS ----------
    function bulkActivate(active) {
      const action = active ? 'activate' : 'deactivate';
      if (!confirm(`Are you sure you want to ${action} ALL bots?`)) return;
      botsList.forEach(bot => {
        if (bot.active !== active) {
          socket.emit('admin:setBotActive', { botId: bot.userId, active });
        }
      });
    }

    function bulkAddFunds(amount) {
      if (!confirm(`Add ${amount} ETB to ALL bots?`)) return;
      botsList.forEach(bot => {
        socket.emit('admin:addBotFunds', { botId: bot.userId, amount });
      });
    }

    function refreshBots() {
      if (!authenticated) {
        showToast('Not authenticated, waiting...', 'error');
        return;
      }
      socket.emit('admin:getBotsList');
    }

    // ---------- EXPOSE FUNCTIONS GLOBALLY (for onclick attributes) ----------
    window.filterBots = filterBots;
    window.addNewBot = addNewBot;
    window.bulkActivate = bulkActivate;
    window.bulkAddFunds = bulkAddFunds;
    window.refreshBots = refreshBots;
    window.closeModal = closeModal;
    window.setModalActive = setModalActive;
    window.saveModalChanges = saveModalChanges;

    // ---------- SOCKET EVENTS ----------
    socket.on('connect', () => {
      connectionStatus.innerHTML = '<i class="fas fa-circle" style="color:#10b981;"></i> Connected';
      socket.emit('admin:auth', 'passwordless');
    });

    socket.on('disconnect', () => {
      connectionStatus.innerHTML = '<i class="fas fa-circle" style="color:#ef4444;"></i> Disconnected';
      authenticated = false;
    });

    socket.on('admin:authSuccess', () => {
      authenticated = true;
      showToast('Authenticated successfully', 'success');
      refreshBots();
    });

    socket.on('admin:authError', (err) => {
      showToast('Auth failed: ' + (err || 'unknown'), 'error');
      setTimeout(() => socket.emit('admin:auth', 'passwordless'), 3000);
    });

    socket.on('admin:botsList', (bots) => {
      botsList = bots;
      updateStats(botsList);
      filterBots(); // applies search and renders
    });

    socket.on('admin:error', (msg) => {
      showToast('Error: ' + msg, 'error');
    });

    socket.on('admin:success', (msg) => {
      showToast(msg, 'success');
    });

    socket.on('admin:botFundsAdded', (result) => {
      showToast(`Funds added, new balance: ${result.newBalance.toFixed(2)} ETB`, 'success');
      refreshBots(); // refresh to get updated balance
    });

    // Auto-refresh every 30 seconds
    setInterval(() => {
      if (authenticated) socket.emit('admin:getBotsList');
    }, 30000);
  })();
</script>
</body>
</html>
