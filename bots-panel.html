<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BOTS ELITE · COMMAND CENTER</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ----- GLOBAL STYLES ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 20% 30%, #0c1420, #020408);
      min-height: 100vh;
      padding: 1.5rem;
      color: #f0f4fa;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ----- GLASS HEADER ----- */
    .glass-header {
      background: rgba(10, 20, 30, 0.6);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 40px;
      padding: 1rem 2rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: 0 20px 40px -10px #00000080;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo i {
      font-size: 2rem;
      background: linear-gradient(135deg, #3b82f6, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px #3b82f6);
    }

    .logo h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(to right, #b3d9ff, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .connection-badge {
      background: #1a2938;
      padding: 0.5rem 1.5rem;
      border-radius: 40px;
      border: 1px solid #3b82f6;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 0 15px #3b82f640;
    }

    /* ----- STATS CARDS (GLASS) ----- */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: rgba(15, 25, 35, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid #2d4055;
      border-radius: 28px;
      padding: 1.5rem 1.2rem;
      box-shadow: 0 12px 28px -8px black;
      transition: 0.2s;
    }

    .stat-card:hover {
      border-color: #3b82f6;
      transform: translateY(-4px);
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8fadc9;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 800;
      color: white;
      line-height: 1.1;
      text-shadow: 0 2px 5px #00000060;
    }

    .stat-detail {
      font-size: 0.8rem;
      color: #6f8cac;
      margin-top: 0.3rem;
    }

    /* ----- CONTROL BAR ----- */
    .control-bar {
      background: rgba(8, 16, 24, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid #2a4055;
      border-radius: 50px;
      padding: 0.8rem 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 1.5rem;
    }

    .control-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      background: #1f3142;
      border: 1px solid #3a506b;
      color: #e2eaf3;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 4px 12px #00000030;
    }

    .btn i { font-size: 1rem; color: #7f9bc0; }
    .btn-primary { background: #2563eb; border-color: #4b8bff; color: white; }
    .btn-primary i { color: white; }
    .btn-primary:hover { background: #3b82f6; }
    .btn-success { background: #0b6b5e; border-color: #1e9b87; }
    .btn-success:hover { background: #14b8a6; }
    .btn-warning { background: #b45309; border-color: #ea9b3e; }
    .btn-warning:hover { background: #d97706; }
    .btn-outline { background: transparent; }
    .btn-outline:hover { background: #1f3142; }

    .search-wrapper {
      flex: 1;
      min-width: 240px;
      display: flex;
      align-items: center;
      background: #0e1a26;
      border: 1px solid #2d4057;
      border-radius: 40px;
      padding: 0.2rem 0.2rem 0.2rem 1.2rem;
    }
    .search-wrapper i { color: #6f8cac; }
    .search-wrapper input {
      background: transparent;
      border: none;
      padding: 0.6rem 0.8rem;
      color: white;
      width: 100%;
      outline: none;
      font-size: 0.95rem;
    }
    .search-wrapper input::placeholder { color: #4a607a; }

    /* ----- BOTS GRID (GLASS CARDS) ----- */
    .bots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .bot-card {
      background: rgba(18, 28, 38, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid #2d4057;
      border-radius: 30px;
      padding: 1.5rem;
      box-shadow: 0 20px 30px -12px black;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }

    .bot-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #3b82f6, #a855f7, #ec4899);
      opacity: 0.8;
    }

    .bot-card:hover {
      border-color: #3b82f6;
      transform: scale(1.02);
      box-shadow: 0 30px 40px -10px #1e3a8a;
    }

    .bot-avatar {
      width: 56px;
      height: 56px;
      background: linear-gradient(145deg, #1e3a5f, #0f2b44);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 600;
      color: #a5d8ff;
      border: 2px solid #3b82f6;
      box-shadow: 0 0 15px #3b82f6;
    }

    .bot-info {
      flex: 1;
      margin-left: 1rem;
    }

    .bot-name {
      font-weight: 700;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .bot-name span { cursor: pointer; padding: 0.2rem 0.4rem; border-radius: 8px; transition: background 0.1s; }
    .bot-name span:hover { background: #253c54; }
    .bot-id {
      font-size: 0.7rem;
      color: #7f9bc0;
      font-family: monospace;
    }

    .inline-edit-input {
      background: #0e1a26;
      border: 1px solid #3b82f6;
      border-radius: 30px;
      padding: 0.3rem 1rem;
      color: white;
      font-size: 1rem;
      width: 100%;
      outline: none;
    }

    .balance-box {
      background: #0d1a26;
      border-radius: 30px;
      padding: 0.5rem 1rem;
      margin: 1rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #2e5775;
    }
    .balance-amount {
      font-weight: 700;
      color: #fbbf24;
      font-size: 1.2rem;
    }
    .room-badge {
      background: #1c3f5c;
      border-radius: 30px;
      padding: 0.2rem 1rem;
      font-size: 0.75rem;
      color: #8fc9ff;
      border: 1px solid #3b82f6;
    }

    .status-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0.8rem 0;
    }
    .status-badge {
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-active { background: #0a3f2b; color: #6fcf97; border: 1px solid #27ae60; }
    .status-inactive { background: #441e1e; color: #f29091; border: 1px solid #eb5757; }

    .action-buttons {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      justify-content: flex-end;
    }
    .icon-btn {
      background: #1c3144;
      border: none;
      color: #cfddee;
      width: 38px;
      height: 38px;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.15s;
      font-size: 1rem;
    }
    .icon-btn:hover { background: #2d4b66; color: white; }
    .icon-btn.green:hover { background: #0f766e; }
    .icon-btn.blue:hover { background: #2563eb; }
    .icon-btn.red:hover { background: #991b1b; }

    /* Add funds inline */
    .add-funds-row {
      margin: 0.5rem 0;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .add-funds-input {
      background: #0e1a26;
      border: 1px solid #3b82f6;
      border-radius: 30px;
      padding: 0.4rem 1rem;
      color: white;
      width: 120px;
      font-size: 0.85rem;
    }

    /* Toast */
    .toast-stack {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      background: #1f2c3b;
      border-left: 6px solid;
      border-radius: 20px;
      padding: 1rem 1.5rem;
      box-shadow: 0 20px 30px -10px black;
      min-width: 280px;
      display: flex;
      align-items: center;
      gap: 1rem;
      backdrop-filter: blur(10px);
      animation: slideInRight 0.3s ease;
    }
    .toast.success { border-color: #10b981; }
    .toast.error { border-color: #ef4444; }
    .toast.info { border-color: #3b82f6; }
    .toast i { font-size: 1.2rem; }
    .toast.success i { color: #10b981; }
    .toast.error i { color: #ef4444; }
    .toast.info i { color: #3b82f6; }
    .toast-close {
      margin-left: auto;
      cursor: pointer;
      color: #9caec9;
    }
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .loading-skeleton {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem;
      color: #4d688b;
    }
    .fa-spinner { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem;
      background: rgba(15, 25, 35, 0.7);
      border-radius: 40px;
      color: #6f8cac;
      border: 2px dashed #2d4b68;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Glass Header -->
  <div class="glass-header">
    <div class="logo">
      <i class="fas fa-microchip"></i>
      <h1>BOTS ELITE</h1>
    </div>
    <div class="connection-badge" id="connectionStatus">
      <i class="fas fa-circle" style="color: #f59e0b;"></i> Connecting...
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="stat-label"><i class="fas fa-robot"></i> Total bots</div><div class="stat-value" id="statTotalBots">0</div><div class="stat-detail">registered</div></div>
    <div class="stat-card"><div class="stat-label"><i class="fas fa-check-circle"></i> Active</div><div class="stat-value" id="statActiveBots">0</div><div class="stat-detail">ready</div></div>
    <div class="stat-card"><div class="stat-label"><i class="fas fa-coins"></i> Total balance</div><div class="stat-value" id="statTotalBalance">0</div><div class="stat-detail">ETB</div></div>
    <div class="stat-card"><div class="stat-label"><i class="fas fa-door-open"></i> In rooms</div><div class="stat-value" id="statInRooms">0</div><div class="stat-detail">playing</div></div>
  </div>

  <!-- Control Bar -->
  <div class="control-bar">
    <div class="control-group">
      <input type="text" id="newBotName" class="inline-edit-input" placeholder="Bot name" style="width:160px;">
      <button class="btn btn-primary" onclick="addNewBot()"><i class="fas fa-plus-circle"></i> Add bot</button>
    </div>
    <div class="control-group">
      <button class="btn btn-success" onclick="bulkActivate(true)"><i class="fas fa-power-off"></i> Activate all</button>
      <button class="btn btn-warning" onclick="bulkActivate(false)"><i class="fas fa-power-off"></i> Deactivate all</button>
      <button class="btn btn-outline" onclick="bulkAddFunds(1000)"><i class="fas fa-gift"></i> +1000 to all</button>
    </div>
    <div class="search-wrapper">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Filter by name or ID..." oninput="filterBots()">
    </div>
    <button class="btn btn-outline" onclick="refreshBots()"><i class="fas fa-sync-alt"></i> Refresh</button>
  </div>

  <!-- Bots Grid -->
  <div id="botsGridContainer">
    <div class="loading-skeleton" id="loadingIndicator">
      <i class="fas fa-spinner"></i> &nbsp; Loading bots...
    </div>
    <div class="bots-grid" id="botsGrid" style="display: none;"></div>
  </div>
</div>

<!-- Toast Stack -->
<div class="toast-stack" id="toastStack"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  (function() {
    // ---------- STATE ----------
    const socket = io();
    let authenticated = false;
    let botsList = [];
    let filteredBots = [];

    // DOM elements
    const connectionStatus = document.getElementById('connectionStatus');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const botsGrid = document.getElementById('botsGrid');
    const toastStack = document.getElementById('toastStack');

    // Stats elements
    const statTotalBots = document.getElementById('statTotalBots');
    const statActiveBots = document.getElementById('statActiveBots');
    const statTotalBalance = document.getElementById('statTotalBalance');
    const statInRooms = document.getElementById('statInRooms');

    // ---------- HELPERS ----------
    function showToast(message, type = 'info', duration = 4000) {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icon = type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-circle-exclamation' : 'fa-info-circle');
      toast.innerHTML = `
        <i class="fas ${icon}"></i>
        <span>${message}</span>
        <i class="fas fa-times toast-close" onclick="this.parentElement.remove()"></i>
      `;
      toastStack.appendChild(toast);
      setTimeout(() => toast.remove(), duration);
    }

    function updateStats(bots) {
      const total = bots.length;
      const active = bots.filter(b => b.active).length;
      const totalBal = bots.reduce((acc, b) => acc + (Number(b.balance) || 0), 0).toFixed(2);
      const inRooms = bots.filter(b => b.currentRoom).length;
      statTotalBots.innerText = total;
      statActiveBots.innerText = active;
      statTotalBalance.innerText = totalBal;
      statInRooms.innerText = inRooms;
    }

    // ---------- RENDER GRID ----------
    function renderBotsGrid(bots) {
      botsGrid.style.display = 'grid';
      loadingIndicator.style.display = 'none';

      if (!bots || bots.length === 0) {
        botsGrid.innerHTML = '<div class="empty-state"><i class="fas fa-robot" style="font-size:3rem; opacity:0.4;"></i><br>No bots found. Create one!</div>';
        return;
      }

      let html = '';
      bots.forEach(bot => {
        const balance = Number(bot.balance).toFixed(2);
        const statusClass = bot.active ? 'status-active' : 'status-inactive';
        const statusText = bot.active ? 'Active' : 'Inactive';
        const roomInfo = bot.currentRoom ? `<span class="room-badge"><i class="fas fa-door-open"></i> ${bot.currentRoom} ETB / Box ${bot.box}</span>` : '<span class="room-badge">—</span>';
        const avatarLetter = bot.userName.charAt(0).toUpperCase();

        html += `
          <div class="bot-card" id="card-${bot.userId}" data-userid="${bot.userId}">
            <div style="display: flex; align-items: center; margin-bottom: 0.5rem;">
              <div class="bot-avatar">${avatarLetter}</div>
              <div class="bot-info">
                <div class="bot-name" id="nameContainer-${bot.userId}">
                  <span id="nameSpan-${bot.userId}" onclick="startRename('${bot.userId}')">${bot.userName}</span>
                  <input type="text" id="renameInput-${bot.userId}" class="inline-edit-input" value="${bot.userName}" style="display:none;" onblur="saveRename('${bot.userId}')" onkeypress="if(event.key==='Enter'){this.blur();}">
                </div>
                <div class="bot-id">${bot.userId}</div>
              </div>
            </div>

            <div class="balance-box">
              <span><i class="fas fa-coins" style="color:#fbbf24;"></i> Balance</span>
              <span class="balance-amount" id="balanceDisplay-${bot.userId}">${balance} ETB</span>
            </div>

            <!-- Add funds inline (hidden by default) -->
            <div id="fundsRow-${bot.userId}" class="add-funds-row" style="display:none;">
              <input type="number" id="fundsInput-${bot.userId}" class="add-funds-input" placeholder="Amount" min="1" step="any">
              <button class="icon-btn green" onclick="addFunds('${bot.userId}')" title="Send"><i class="fas fa-paper-plane"></i></button>
              <button class="icon-btn" onclick="cancelAddFunds('${bot.userId}')" title="Cancel"><i class="fas fa-times"></i></button>
            </div>

            <div class="status-toggle">
              <span class="status-badge ${statusClass}" id="statusBadge-${bot.userId}">${statusText}</span>
              <span class="room-badge">${roomInfo}</span>
            </div>

            <div class="action-buttons">
              <button class="icon-btn blue" onclick="toggleAddFunds('${bot.userId}')" title="Add funds"><i class="fas fa-coins"></i></button>
              <button class="icon-btn ${bot.active ? 'red' : 'blue'}" onclick="setActive('${bot.userId}', ${!bot.active})" title="${bot.active ? 'Deactivate' : 'Activate'}">
                <i class="fas ${bot.active ? 'fa-toggle-on' : 'fa-toggle-off'}"></i>
              </button>
            </div>
          </div>
        `;
      });
      botsGrid.innerHTML = html;
    }

    // ---------- FILTER ----------
    window.filterBots = function() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      filteredBots = query
        ? botsList.filter(bot => bot.userId.toLowerCase().includes(query) || bot.userName.toLowerCase().includes(query))
        : botsList;
      renderBotsGrid(filteredBots);
    };

    // ---------- RENAME (inline) ----------
    window.startRename = function(botId) {
      const span = document.getElementById(`nameSpan-${botId}`);
      const input = document.getElementById(`renameInput-${botId}`);
      if (!span || !input) return;
      span.style.display = 'none';
      input.style.display = 'inline-block';
      input.value = span.innerText; // ensure fresh
      input.focus();
      input.select();
    };

    window.saveRename = function(botId) {
      const input = document.getElementById(`renameInput-${botId}`);
      const span = document.getElementById(`nameSpan-${botId}`);
      const newName = input.value.trim();
      if (!newName) {
        showToast('Name cannot be empty', 'error');
        input.style.display = 'none';
        span.style.display = 'inline';
        return;
      }
      // Emit rename event
      socket.emit('admin:renameBot', { botId, newName });
      // Optimistic update
      span.innerText = newName;
      span.style.display = 'inline';
      input.style.display = 'none';
    };

    // ---------- ADD FUNDS ----------
    window.toggleAddFunds = function(botId) {
      // Hide any other open fund rows
      document.querySelectorAll('[id^="fundsRow-"]').forEach(row => row.style.display = 'none');
      const row = document.getElementById(`fundsRow-${botId}`);
      if (row) row.style.display = 'flex';
    };

    window.cancelAddFunds = function(botId) {
      document.getElementById(`fundsRow-${botId}`).style.display = 'none';
    };

    window.addFunds = function(botId) {
      const input = document.getElementById(`fundsInput-${botId}`);
      const amount = parseFloat(input.value);
      if (isNaN(amount) || amount <= 0) {
        showToast('Enter a valid positive amount', 'error');
        return;
      }
      socket.emit('admin:addBotFunds', { botId, amount });
      document.getElementById(`fundsRow-${botId}`).style.display = 'none';
      input.value = '';
    };

    // ---------- SET ACTIVE ----------
    window.setActive = function(botId, active) {
      socket.emit('admin:setBotActive', { botId, active });
    };

    // ---------- ADD NEW BOT ----------
    window.addNewBot = function() {
      const name = document.getElementById('newBotName').value.trim();
      socket.emit('admin:addNewBot', { name: name || undefined });
      document.getElementById('newBotName').value = '';
    };

    // ---------- BULK ACTIONS ----------
    window.bulkActivate = function(active) {
      const action = active ? 'activate' : 'deactivate';
      if (!confirm(`Are you sure you want to ${action} ALL bots?`)) return;
      botsList.forEach(bot => {
        if (bot.active !== active) {
          socket.emit('admin:setBotActive', { botId: bot.userId, active });
        }
      });
    };

    window.bulkAddFunds = function(amount) {
      if (!confirm(`Add ${amount} ETB to ALL bots?`)) return;
      botsList.forEach(bot => {
        socket.emit('admin:addBotFunds', { botId: bot.userId, amount });
      });
    };

    window.refreshBots = function() {
      if (!authenticated) {
        showToast('Not authenticated, waiting...', 'error');
        return;
      }
      socket.emit('admin:getBotsList');
    };

    // ---------- SOCKET EVENTS ----------
    socket.on('connect', () => {
      connectionStatus.innerHTML = '<i class="fas fa-circle" style="color:#10b981;"></i> Connected';
      socket.emit('admin:auth', 'passwordless');
    });

    socket.on('disconnect', () => {
      connectionStatus.innerHTML = '<i class="fas fa-circle" style="color:#ef4444;"></i> Disconnected';
      authenticated = false;
    });

    socket.on('admin:authSuccess', () => {
      authenticated = true;
      showToast('Authenticated successfully', 'success');
      refreshBots();
    });

    socket.on('admin:authError', (err) => {
      showToast('Auth failed: ' + (err || 'unknown'), 'error');
      setTimeout(() => socket.emit('admin:auth', 'passwordless'), 3000);
    });

    socket.on('admin:botsList', (bots) => {
      botsList = bots;
      updateStats(botsList);
      filterBots(); // applies search and renders
    });

    socket.on('admin:error', (msg) => {
      showToast('Error: ' + msg, 'error');
    });

    socket.on('admin:success', (msg) => {
      showToast(msg, 'success');
    });

    socket.on('admin:botFundsAdded', (result) => {
      showToast(`Funds added, new balance: ${result.newBalance.toFixed(2)} ETB`, 'success');
      refreshBots(); // refresh to get updated balance
    });

    // Auto-refresh every 30 seconds
    setInterval(() => {
      if (authenticated) socket.emit('admin:getBotsList');
    }, 30000);
  })();
</script>
</body>
</html>
