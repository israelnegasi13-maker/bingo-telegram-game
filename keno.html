<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KENO ULTRA · VIRTUAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #0b0e1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            background-image: radial-gradient(circle at 30% 10%, rgba(45, 85, 255, 0.15), transparent 40%),
                              radial-gradient(circle at 80% 70%, rgba(160, 70, 255, 0.12), transparent 40%);
        }

        .game-container {
            max-width: 500px;
            width: 100%;
            background: rgba(10, 15, 30, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 36px;
            padding: 20px 16px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.06);
            position: relative;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(145deg, #2e4bff, #9f4bff);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 8px 18px #2e4bff40;
        }
        .logo-text h2 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .logo-text p {
            font-size: 9px;
            opacity: 0.6;
            letter-spacing: 1px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .balance-badge {
            background: rgba(255,255,255,0.05);
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255,215,0,0.3);
            font-weight: 700;
            font-size: 15px;
            color: #ffd966;
            box-shadow: 0 0 12px #ffd96620;
        }
        .sound-toggle {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .sound-toggle.muted {
            background: rgba(255,80,80,0.2);
            color: #ffa0a0;
        }

        /* connection status */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            padding: 6px 14px;
            margin-bottom: 18px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #2cd46e;
            border-radius: 50%;
            box-shadow: 0 0 12px #2cd46e;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse { 50% { opacity: 0.4; } }

        /* ===== SYSTEM MESSAGE BANNER (at top) ===== */
        .system-message {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 460px;
            background: rgba(20, 30, 50, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid #ff4d4d80;
            border-radius: 40px;
            padding: 12px 20px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            z-index: 3000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7), 0 0 0 1px #ff4d4d40 inset;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .system-message.error {
            border-color: #ff6b6b;
            background: rgba(80, 20, 30, 0.95);
        }
        .system-message.info {
            border-color: #4d9eff;
            background: rgba(20, 40, 70, 0.95);
        }
        .system-message.show {
            display: flex;
        }

        /* betting phase */
        .phase-betting {
            transition: opacity 0.4s, transform 0.4s;
        }
        .phase-betting.hidden {
            display: none;
        }
        .timer-panel {
            background: rgba(20, 30, 55, 0.8);
            border-radius: 50px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            border: 1px solid #2e4bff40;
            box-shadow: inset 0 1px 3px #00000080, 0 10px 20px -10px #000000;
        }
        .timer-display {
            font-size: 32px;
            font-weight: 800;
            font-family: 'Courier New', monospace;
            background: #0a0f1c;
            padding: 4px 16px;
            border-radius: 40px;
            letter-spacing: 4px;
            color: #f0c45a;
            text-shadow: 0 0 12px #ffb347;
        }
        .round-info {
            display: flex;
            gap: 16px;
            color: #a0b5dd;
            font-size: 13px;
        }

        .grid-title {
            display: flex;
            justify-content: space-between;
            margin: 12px 0 8px;
            font-size: 13px;
            color: #b7c9ff;
        }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            margin-bottom: 20px;
        }
        .keno-number {
            aspect-ratio: 1;
            background: rgba(20, 30, 55, 0.8);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #c7d6ff;
            border: 1px solid #2e4bff30;
            transition: 0.15s;
            box-shadow: 0 2px 4px #00000040;
            cursor: pointer;
        }
        .keno-number.selected {
            background: linear-gradient(145deg, #4169ff, #9d4eff);
            color: white;
            border-color: #f6b83d;
            transform: scale(1.04);
            box-shadow: 0 0 18px #6a4eff;
        }

        .chips {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 20px 0 16px;
        }
        .chip {
            background: #1e2740;
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 14px;
            color: #ffd966;
            border: 1px solid #ffd96660;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 4px 0 #0b0e1a;
        }
        .chip.selected {
            background: #ffd966;
            color: #0b0e1a;
            border-color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #a57c2e;
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin: 8px 0 12px;
        }
        .btn {
            flex: 1;
            padding: 16px 10px;
            border: none;
            border-radius: 60px;
            font-weight: 800;
            font-size: 16px;
            background: #222c4a;
            color: white;
            box-shadow: 0 8px 0 #0d1225;
            transition: 0.1s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(145deg, #4169ff, #7a4dff);
            box-shadow: 0 8px 0 #1f2b70;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #0d1225; }
        .btn:disabled { opacity: 0.4; transform: none; box-shadow: 0 4px 0 #0d1225; }

        /* ========== SPHERE DRAW PHASE ========== */
        .phase-sphere {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeScale 0.6s ease;
        }
        .phase-sphere.active { display: flex; }

        @keyframes fadeScale {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .sphere-window {
            background: rgba(16, 22, 45, 0.9);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 70px 70px 50px 50px;
            padding: 35px 25px 30px;
            margin: 10px 0 25px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 -8px 20px #00000080, 0 25px 35px #000000, 0 0 0 2px #2e4bff20 inset;
        }

        .sphere-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto;
        }

        .sphere-glass {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(
                circle at 25% 25%,
                rgba(255, 255, 255, 0.95) 0%,
                rgba(240, 248, 255, 0.8) 10%,
                rgba(180, 210, 255, 0.6) 25%,
                rgba(80, 120, 200, 0.5) 45%,
                rgba(20, 40, 80, 0.7) 70%,
                rgba(5, 10, 25, 0.95) 100%
            );
            box-shadow: 
                0 0 0 3px rgba(255, 255, 240, 0.5),
                0 30px 50px rgba(0, 0, 0, 0.9),
                inset 0 -20px 30px #0a1a3a,
                inset 0 20px 40px rgba(200, 220, 255, 0.6),
                inset 0 0 30px rgba(255, 255, 255, 0.4);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 200, 0.7);
            transition: box-shadow 0.2s;
        }

        .sphere-glass.spinning .inner-balls {
            animation: rotateBalls 20s linear infinite;
        }

        @keyframes rotateBalls {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .inner-balls {
            position: relative;
            width: 100%;
            height: 100%;
            transform-origin: center center;
        }

        .mini-ball {
            position: absolute;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--ball-color);
            box-shadow: 
                0 8px 12px rgba(0,0,0,0.7),
                0 0 0 2px rgba(255,255,200,0.5) inset,
                0 -4px 6px rgba(0,0,0,0.8) inset,
                4px 4px 12px rgba(255,255,255,0.6) inset,
                -2px -2px 8px rgba(0,0,0,0.4) inset;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: black;
            text-shadow: 0 1px 1px rgba(255,255,255,0.3);
            pointer-events: none;
            will-change: transform, opacity;
            transition: opacity 0.2s;
            transform: translate(-50%, -50%);
            overflow: hidden;
        }
        .mini-ball::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 15%;
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 80%);
            pointer-events: none;
            z-index: 2;
        }
        .mini-ball.selected-ball {
            box-shadow: 
                0 8px 12px rgba(0,0,0,0.7),
                0 0 0 3px gold,
                0 0 0 6px rgba(255, 215, 0, 0.3),
                0 0 20px gold,
                0 0 30px rgba(255, 215, 0, 0.5);
            transform: translate(-50%, -50%) scale(1.1);
            transition: all 0.2s ease;
            z-index: 5;
        }
        .mini-ball.selected-ball::after {
            content: "★";
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 10px;
            color: gold;
            text-shadow: 0 0 5px black;
            z-index: 3;
        }

        /* flying clone – will be positioned absolutely on body */
        .flying-ball {
            position: fixed;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
            color: black;
            text-shadow: 0 1px 1px rgba(255,255,255,0.3);
            box-shadow: 
                0 8px 12px rgba(0,0,0,0.7),
                0 0 0 2px rgba(255,255,200,0.5) inset,
                0 -4px 6px rgba(0,0,0,0.8) inset,
                4px 4px 12px rgba(255,255,255,0.6) inset,
                -2px -2px 8px rgba(0,0,0,0.4) inset;
            background: var(--ball-color);
            z-index: 10000;
            pointer-events: none;
            will-change: transform, opacity;
            transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.1), opacity 0.3s;
            opacity: 1;
        }

        /* drawn balls row */
        .drawn-balls-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin: 30px 0 15px;
            min-height: 40px;
        }
        .drawn-ball {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            color: black;
            text-shadow: 0 1px 1px rgba(255,255,255,0.3);
            box-shadow: 0 4px 0 #3f2e0e, 0 0 0 2px #ffeeaa inset, 0 5px 8px black;
            transform: scale(1);
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .draw-footer {
            font-size: 13px;
            color: #aab9f0;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: #0e1428;
            padding: 8px 28px;
            border-radius: 40px;
            border: 1px solid #f0b34b30;
            margin-top: 8px;
        }

        /* game history */
        .game-history {
            margin-top: 20px;
            background: #0d1225b0;
            border-radius: 30px;
            padding: 14px;
        }
        .history-title { font-size: 12px; opacity: 0.7; margin-bottom: 8px; }
        .history-list { display: flex; flex-direction: column; gap: 6px; max-height: 70px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; font-size: 11px; }

        /* win/loss toast – now at top with high z-index */
        .result-toast {
            position: fixed;
            top: 100px;                 /* moved down a bit to clear header/system */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            border: 1px solid gold;
            border-radius: 60px;
            padding: 14px 28px;
            font-weight: 800;
            font-size: 18px;
            color: white;
            box-shadow: 0 10px 30px black;
            z-index: 9999;              /* always on top */
            display: none;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }
        .result-toast.show { display: flex; }
        .result-toast.win { background: #1f4a2c; border-color: #ffd966; }
        .result-toast.lose { background: #5a1e2b; border-color: #ff8a8a; }

        .confirmation-modal {
            position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .confirmation-modal.active { display: flex; }
        .confirmation-content { background: #141c34; padding: 24px; border-radius: 32px; max-width: 300px; border: 1px solid gold; color: white; }
        .confirmation-content h3 { color: gold; margin-bottom: 12px; }
        .payout-breakdown { font-size: 12px; color: #aac3ff; margin-top: 8px; }

        /* ===== SOUND PREFERENCE MODAL ===== */
        .sound-preference-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.96);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 5000;
        }
        .sound-preference-modal.active {
            display: flex;
        }
        .sound-preference-content {
            background: #141c34;
            padding: 28px 24px;
            border-radius: 48px;
            max-width: 320px;
            width: 90%;
            border: 2px solid gold;
            color: white;
            text-align: center;
            box-shadow: 0 20px 40px black;
        }
        .sound-preference-content h3 {
            color: gold;
            font-size: 24px;
            margin-bottom: 12px;
        }
        .sound-preference-content p {
            color: #b7c9ff;
            margin-bottom: 20px;
        }
        .sound-preference-content .btn {
            min-width: 100px;
            margin: 0 8px;
        }
    </style>
</head>
<body>
<div class="game-container">
    <!-- header -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">🎰</div>
            <div class="logo-text">
                <h2>KENO ULTRA</h2>
                <p>VIRTUAL SPHERE</p>
            </div>
        </div>
        <div class="header-actions">
            <div class="balance-badge" id="balance">0 ETB</div>
            <div class="sound-toggle" id="soundToggle"><i class="fa-solid fa-volume-high"></i></div>
        </div>
    </div>

    <!-- connection status -->
    <div class="status-bar" id="connection-status">
        <span class="dot"></span>
        <span id="status-text">CONNECTING</span>
    </div>

    <!-- system message banner (for round inactive, insufficient balance, etc.) -->
    <div id="systemMessage" class="system-message"></div>

    <!-- ========== BETTING PHASE ========== -->
    <div id="bettingPhase" class="phase-betting">
        <div class="timer-panel">
            <span class="round-info"><i class="fa-regular fa-clock"></i> ROUND <span id="roundNumber">1</span></span>
            <span class="timer-display" id="countdown">00:30</span>
        </div>

        <div class="grid-title">
            <span>🎯 SELECT 1–5 NUMBERS</span>
            <span id="selectedCount">0/5</span>
        </div>
        <div class="numbers-grid" id="kenoGrid"></div>

        <div style="text-align: center; margin: 4px 0 8px;">
            <button class="quick-pick-btn" id="quickPick" style="background:none; border:1px solid #2e4bff; border-radius:40px; padding:8px 16px; color:#aac3ff"><i class="fa-solid fa-shuffle"></i> QUICK PICK</button>
        </div>

        <!-- chips -->
        <div class="chips" id="chipContainer">
            <div class="chip selected" data-value="5">5</div>
            <div class="chip" data-value="10">10</div>
            <div class="chip" data-value="20">20</div>
            <div class="chip" data-value="50">50</div>
            <div class="chip" data-value="100">100</div>
        </div>

        <!-- action -->
        <div class="action-row">
            <button class="btn btn-primary" id="playBtn" disabled><i class="fa-regular fa-circle-check"></i> PLACE BET</button>
            <button class="btn" id="clearBtn"><i class="fa-regular fa-trash-can"></i> CLEAR</button>
        </div>
        <div class="waiting-message" id="waitingMessage" style="display:none; color:#f0b34b; text-align:center;">⏳ Waiting for players...</div>
    </div>

    <!-- ========== SPHERE DRAW PHASE ========== -->
    <div id="spherePhase" class="phase-sphere">
        <div class="sphere-window">
            <div class="sphere-wrapper">
                <div class="sphere-glass" id="sphereGlass">
                    <div class="inner-balls" id="innerBallsContainer"></div>
                </div>
                <!-- four rods attached to sphere -->
                <div class="rod rod-top-left"></div>
                <div class="rod rod-top-right"></div>
                <div class="rod rod-bottom-left"></div>
                <div class="rod rod-bottom-right"></div>
            </div>
            <div class="drawn-balls-row" id="drawnBallsRow"></div>
            <div class="draw-footer">
                <span id="currentBallCount">0</span> / <span id="totalBallsCount">20</span> BALLS DRAWN
            </div>
        </div>
    </div>

    <!-- game history -->
    <div class="game-history">
        <div class="history-title">RECENT WINS</div>
        <div class="history-list" id="historyList"></div>
    </div>

    <!-- win/loss toast (now at top) -->
    <div id="resultToast" class="result-toast"></div>

    <!-- confirmation modal -->
    <div class="confirmation-modal" id="confirmationModal">
        <div class="confirmation-content">
            <h3>CONFIRM BET</h3>
            <div id="confirmDetails"></div>
            <div id="payoutBreakdown" class="payout-breakdown"></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn" id="confirmCancel">CANCEL</button>
                <button class="btn btn-primary" id="confirmOk">CONFIRM</button>
            </div>
        </div>
    </div>

    <!-- ===== SOUND PREFERENCE MODAL (shown on first visit) ===== -->
    <div class="sound-preference-modal" id="soundPreferenceModal">
        <div class="sound-preference-content">
            <h3>🔊 ENABLE SOUND?</h3>
            <p>Do you want sound effects during the game?</p>
            <div style="display:flex; gap:20px; justify-content:center; margin-top:20px;">
                <button class="btn" id="soundYes">YES</button>
                <button class="btn" id="soundNo">NO</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- ROBUST USER ID LOGIC ----------
        let userId, userName;
        const appUserId = sessionStorage.getItem('appUserId');
        const appUserName = sessionStorage.getItem('appUserName');
        if (appUserId) {
            userId = appUserId;
            userName = appUserName || 'App User';
        } else {
            const tg = window.Telegram?.WebApp;
            const user = tg?.initDataUnsafe?.user;
            if (user) {
                userId = `tg_${user.id}`;
                userName = user.first_name || 'Player';
                localStorage.setItem('telegramUser', JSON.stringify({
                    id: user.id,
                    firstName: user.first_name,
                    username: user.username
                }));
            } else {
                const savedUser = localStorage.getItem('telegramUser');
                if (savedUser) {
                    const userData = JSON.parse(savedUser);
                    userId = `tg_${userData.id}`;
                    userName = userData.firstName || 'Player';
                } else {
                    let storedId = localStorage.getItem('kenoUserId');
                    if (storedId) {
                        userId = storedId;
                        userName = localStorage.getItem('kenoUserName') || 'Player';
                    } else {
                        userId = 'test_' + Math.random().toString(36).substr(2, 9);
                        userName = 'Test Player';
                        localStorage.setItem('kenoUserId', userId);
                        localStorage.setItem('kenoUserName', userName);
                    }
                }
            }
        }

        // ---------- Socket connection ----------
        const socket = io(window.location.origin, { transports: ['websocket', 'polling'] });

        // DOM elements
        const bettingPhase = document.getElementById('bettingPhase');
        const spherePhase = document.getElementById('spherePhase');
        const sphereGlass = document.getElementById('sphereGlass');
        const innerBalls = document.getElementById('innerBallsContainer');
        const drawnBallsRow = document.getElementById('drawnBallsRow');
        const currentBallSpan = document.getElementById('currentBallCount');
        const totalBallsSpan = document.getElementById('totalBallsCount');
        const countdownEl = document.getElementById('countdown');
        const roundSpan = document.getElementById('roundNumber');
        const selectedCountSpan = document.getElementById('selectedCount');
        const balanceSpan = document.getElementById('balance');
        const kenoGrid = document.getElementById('kenoGrid');
        const playBtn = document.getElementById('playBtn');
        const clearBtn = document.getElementById('clearBtn');
        const quickPick = document.getElementById('quickPick');
        const chips = document.querySelectorAll('.chip');
        const waitingMsg = document.getElementById('waitingMessage');
        const historyList = document.getElementById('historyList');
        const confirmModal = document.getElementById('confirmationModal');
        const confirmDetails = document.getElementById('confirmDetails');
        const payoutBreakdown = document.getElementById('payoutBreakdown');
        const confirmCancel = document.getElementById('confirmCancel');
        const confirmOk = document.getElementById('confirmOk');
        const resultToast = document.getElementById('resultToast');
        const soundToggle = document.getElementById('soundToggle');
        const soundIcon = soundToggle.querySelector('i');
        const systemMsg = document.getElementById('systemMessage');
        // Sound preference modal elements
        const soundPreferenceModal = document.getElementById('soundPreferenceModal');
        const soundYes = document.getElementById('soundYes');
        const soundNo = document.getElementById('soundNo');

        // ---------- SOUND PREFERENCE LOGIC (ask on first visit) ----------
        function askSoundPreference() {
            // Only ask if no preference is stored
            if (localStorage.getItem('kenoSound') === null) {
                soundPreferenceModal.classList.add('active');
            }
        }

        // Handle sound preference answers
        soundYes.addEventListener('click', () => {
            localStorage.setItem('kenoSound', 'on');
            soundEnabled = true;
            updateSoundIcon();
            soundPreferenceModal.classList.remove('active');
        });

        soundNo.addEventListener('click', () => {
            localStorage.setItem('kenoSound', 'off');
            soundEnabled = false;
            updateSoundIcon();
            soundPreferenceModal.classList.remove('active');
        });

        // Sound state (default: on, but will be overridden by localStorage)
        let soundEnabled = localStorage.getItem('kenoSound') !== 'off'; // if null, true (default on)
        updateSoundIcon();

        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            localStorage.setItem('kenoSound', soundEnabled ? 'on' : 'off');
            updateSoundIcon();
        });

        function updateSoundIcon() {
            if (soundEnabled) {
                soundIcon.className = 'fa-solid fa-volume-high';
                soundToggle.classList.remove('muted');
            } else {
                soundIcon.className = 'fa-solid fa-volume-xmark';
                soundToggle.classList.add('muted');
            }
        }

        // Game state
        let selectedNumbers = [];
        let currentBet = 5;
        let balance = 0;
        let currentRound = 1;
        let roundActive = false;
        let hasPlacedBet = false;
        let drawnNumbersSoFar = [];
        let turbulenceInterval = null;
        let returnTimeout = null;

        // Turbulence data per ball
        let ballTurbulence = new Map(); // key: ball element, value: { phaseX, phaseY, freqX, freqY, ampScale }

        // Original payout table
        const PAYOUT_TABLE = {
            1: {1: 3},
            2: {2: 10},
            3: {3: 20, 2: 2},
            4: {4: 60, 3: 2, 2: 1},
            5: {5: 200, 4: 50, 3: 20, 2: 1}
        };

        // ---------- SYSTEM MESSAGE FUNCTION ----------
        function showSystemMessage(text, type = 'error') {
            systemMsg.textContent = text;
            systemMsg.className = 'system-message ' + type + ' show';
            setTimeout(() => {
                systemMsg.classList.remove('show');
            }, 3000);
        }

        // ---------- VOICE ANNOUNCEMENT FUNCTION (replaced with audio files) ----------
        function speakNumber(num) {
            if (!soundEnabled) return;
            try {
                const audio = new Audio(`/audio/${num}.mp3`);
                audio.play().catch(e => {
                    console.warn('Audio play failed:', e);
                });
            } catch (e) {
                console.warn('Audio error:', e);
            }
        }

        // ---------- Helper functions ----------
        function updateBalance(val) { balance = val; balanceSpan.innerText = val.toLocaleString() + ' ETB'; }
        function updateCountdown(sec) { 
            const m = Math.floor(sec/60), s = sec%60;
            countdownEl.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        function clearAllSelections() {
            document.querySelectorAll('.keno-number').forEach(el => el.classList.remove('selected'));
            selectedNumbers = [];
            selectedCountSpan.innerText = '0/5';
            playBtn.disabled = true;
        }

        function showResultAndReturnToBetting(won, amount, betAmount) {
            resultToast.className = 'result-toast ' + (won ? 'win' : 'lose');
            resultToast.innerHTML = won ? `🎉 YOU WON ${amount} ETB!` : `💔 YOU LOST ${betAmount} ETB`;
            resultToast.classList.add('show');
            setTimeout(() => {
                resultToast.classList.remove('show');
            }, 3000);

            if (returnTimeout) clearTimeout(returnTimeout);

            setTimeout(() => {
                spherePhase.classList.remove('active');
                bettingPhase.classList.remove('hidden');
                clearAllSelections();
                if (turbulenceInterval) {
                    cancelAnimationFrame(turbulenceInterval);
                    turbulenceInterval = null;
                }
                ballTurbulence.clear();
                resetSphere();
            }, 3000);
        }

        function scheduleReturnToBetting() {
            if (returnTimeout) clearTimeout(returnTimeout);
            returnTimeout = setTimeout(() => {
                console.log('⚠️ No personal result received, returning to betting phase');
                spherePhase.classList.remove('active');
                bettingPhase.classList.remove('hidden');
                clearAllSelections();
                if (turbulenceInterval) {
                    cancelAnimationFrame(turbulenceInterval);
                    turbulenceInterval = null;
                }
                ballTurbulence.clear();
                resetSphere();
            }, 5000);
        }

        // ---------- PROFESSIONAL BALL COLOR (glossy white) ----------
        function getBallColor(number) {
            return "radial-gradient(circle at 30% 30%, #ffffff, #f0f0f0 60%, #d0d0d0 100%)";
        }

        // Create number grid (1-80)
        for (let i=1; i<=80; i++) {
            const btn = document.createElement('div');
            btn.className = 'keno-number';
            btn.dataset.num = i;
            btn.innerText = i;
            btn.addEventListener('click', (e) => {
                if (!roundActive || hasPlacedBet) return;
                const num = i;
                const idx = selectedNumbers.indexOf(num);
                if (idx === -1) {
                    if (selectedNumbers.length >= 5) return;
                    selectedNumbers.push(num);
                    btn.classList.add('selected');
                } else {
                    selectedNumbers.splice(idx,1);
                    btn.classList.remove('selected');
                }
                selectedNumbers.sort((a,b)=>a-b);
                selectedCountSpan.innerText = selectedNumbers.length+'/5';
                playBtn.disabled = selectedNumbers.length === 0;
            });
            kenoGrid.appendChild(btn);
        }

        // Chips
        chips.forEach(c => {
            c.addEventListener('click', () => {
                if (!roundActive || hasPlacedBet) return;
                chips.forEach(ch => ch.classList.remove('selected'));
                c.classList.add('selected');
                currentBet = parseInt(c.dataset.value);
            });
        });

        // Quick pick
        quickPick.addEventListener('click', () => {
            if (!roundActive || hasPlacedBet) return;
            clearAllSelections();
            while(selectedNumbers.length < 5) {
                let r = Math.floor(Math.random()*80)+1;
                if(!selectedNumbers.includes(r)) selectedNumbers.push(r);
            }
            selectedNumbers.sort((a,b)=>a-b);
            selectedNumbers.forEach(n => document.querySelector(`.keno-number[data-num="${n}"]`).classList.add('selected'));
            selectedCountSpan.innerText = '5/5';
            playBtn.disabled = false;
        });

        // Clear
        clearBtn.addEventListener('click', () => {
            if (!roundActive || hasPlacedBet) return;
            clearAllSelections();
        });

        // Play button -> show confirmation
        playBtn.addEventListener('click', () => {
            if (!roundActive || selectedNumbers.length===0 || hasPlacedBet) return;
            const count = selectedNumbers.length;
            const table = PAYOUT_TABLE[count] || {};
            let breakdownHtml = '';
            for (let matches in table) {
                let multiplier = table[matches];
                breakdownHtml += `<div>${matches} match${matches>1?'es':''}: ${currentBet * multiplier} ETB (${multiplier}x)</div>`;
            }
            confirmDetails.innerHTML = `
                <p>Round: #${currentRound}</p>
                <p>Numbers: ${selectedNumbers.join(', ')}</p>
                <p>Bet: ${currentBet} ETB</p>
            `;
            payoutBreakdown.innerHTML = breakdownHtml;
            confirmModal.classList.add('active');
        });
        confirmCancel.addEventListener('click', ()=> confirmModal.classList.remove('active'));
        confirmOk.addEventListener('click', ()=> {
            confirmModal.classList.remove('active');
            if (socket.connected) {
                socket.emit('keno:placeBet', { numbers: selectedNumbers, betAmount: currentBet });
            }
        });

        // ---------- SPHERE WITH TURBULENT MOVEMENT ----------
        function resetSphere() {
            innerBalls.innerHTML = '';
            ballTurbulence.clear();
            for (let i = 1; i <= 80; i++) {
                const ball = document.createElement('div');
                ball.className = 'mini-ball';
                ball.dataset.number = i;
                ball.textContent = i;
                const angle = Math.random() * 2 * Math.PI;
                const radius = (Math.random() * 45 + 30) / 100;
                const left = 50 + 45 * radius * Math.cos(angle);
                const top = 50 + 45 * radius * Math.sin(angle);
                ball.style.left = left + '%';
                ball.style.top = top + '%';
                ball.dataset.baseLeft = left;
                ball.dataset.baseTop = top;
                const color = getBallColor(i);
                ball.style.background = color;
                ball.dataset.color = color;
                ballTurbulence.set(ball, {
                    phaseX: Math.random() * 2 * Math.PI,
                    phaseY: Math.random() * 2 * Math.PI,
                    freqX: 0.5 + Math.random() * 1.5,
                    freqY: 0.5 + Math.random() * 1.5,
                    ampScale: 0.8 + Math.random() * 0.7
                });
                if (selectedNumbers.includes(i)) {
                    ball.classList.add('selected-ball');
                }
                innerBalls.appendChild(ball);
            }
            drawnBallsRow.innerHTML = '';
            drawnNumbersSoFar = [];
            currentBallSpan.innerText = '0';
            totalBallsSpan.innerText = '20';
            sphereGlass.classList.remove('spinning');
        }

        function startTurbulence() {
            if (turbulenceInterval) cancelAnimationFrame(turbulenceInterval);
            let startTime = performance.now();
            function animate() {
                const now = performance.now();
                const t = (now - startTime) / 1000;
                const balls = document.querySelectorAll('.mini-ball');
                balls.forEach(ball => {
                    if (!ball.parentNode) return;
                    const data = ballTurbulence.get(ball);
                    if (!data) return;
                    const offsetX = 8 * Math.sin(t * data.freqX * 2 + data.phaseX) * data.ampScale;
                    const offsetY = 8 * Math.sin(t * data.freqY * 2.3 + data.phaseY) * data.ampScale;
                    ball.style.transform = `translate(-50%, -50%) translate(${offsetX}px, ${offsetY}px)`;
                });
                turbulenceInterval = requestAnimationFrame(animate);
            }
            turbulenceInterval = requestAnimationFrame(animate);
        }

        // ---------- SMOOTH FLIGHT FROM SPHERE TO DRAWN ROW ----------
        function flyBallToRow(number) {
            const originalBall = document.querySelector(`.mini-ball[data-number="${number}"]`);
            if (!originalBall) return;

            // Remove from turbulence so it stops moving
            ballTurbulence.delete(originalBall);

            // Get start position (center of ball relative to viewport)
            const startRect = originalBall.getBoundingClientRect();
            const startX = startRect.left + startRect.width / 2;
            const startY = startRect.top + startRect.height / 2;

            // Get target position: we want the ball to land near the drawn row.
            // We'll target the center of the drawnBallsRow container.
            const targetRect = drawnBallsRow.getBoundingClientRect();
            const targetX = targetRect.left + targetRect.width / 2;
            const targetY = targetRect.top + targetRect.height / 2;

            // Create a flying clone
            const clone = document.createElement('div');
            clone.className = 'flying-ball';
            clone.textContent = number;
            clone.style.background = originalBall.dataset.color || getBallColor(number);
            clone.style.left = (startX - 14) + 'px';  // offset to center (28px width)
            clone.style.top = (startY - 14) + 'px';
            document.body.appendChild(clone);

            // Slightly fade out original ball, will be removed after flight
            originalBall.style.opacity = '0.3';
            originalBall.style.transition = 'opacity 0.3s';

            // Trigger flight after a tiny delay to ensure initial position set
            setTimeout(() => {
                clone.style.transform = `translate(${targetX - startX}px, ${targetY - startY}px) scale(0.9)`;
                clone.style.opacity = '0.8';
            }, 10);

            // After flight, remove clone and original, and add drawn ball
            setTimeout(() => {
                if (clone.parentNode) clone.remove();
                if (originalBall.parentNode) originalBall.remove();

                // Add the drawn ball to the row
                const newBall = document.createElement('div');
                newBall.className = 'drawn-ball';
                newBall.innerText = number;
                newBall.style.background = originalBall.dataset.color || getBallColor(number);
                drawnBallsRow.appendChild(newBall);
                drawnNumbersSoFar.push(number);
                currentBallSpan.innerText = drawnNumbersSoFar.length;

                // Restore any removed balls' styles (just in case)
            }, 500); // match flight duration (0.45s + buffer)
        }

        // Fallback for when ball not found (just add drawn ball)
        function addDrawnBallDirect(number) {
            const color = getBallColor(number);
            const ballDiv = document.createElement('div');
            ballDiv.className = 'drawn-ball';
            ballDiv.innerText = number;
            ballDiv.style.background = color;
            drawnBallsRow.appendChild(ballDiv);
            drawnNumbersSoFar.push(number);
            currentBallSpan.innerText = drawnNumbersSoFar.length;
        }

        // Display all drawn numbers at once (used when restoring state)
        function displayAllDrawnNumbers(numbers) {
            drawnBallsRow.innerHTML = '';
            numbers.forEach(n => {
                removeNumberBall(n);
                const ballDiv = document.createElement('div');
                ballDiv.className = 'drawn-ball';
                ballDiv.innerText = n;
                ballDiv.style.background = getBallColor(n);
                drawnBallsRow.appendChild(ballDiv);
            });
            drawnNumbersSoFar = [...numbers];
            currentBallSpan.innerText = numbers.length;
        }

        // Remove ball without animation (for state restore)
        function removeNumberBall(number) {
            const ball = document.querySelector(`.mini-ball[data-number="${number}"]`);
            if (ball) {
                ballTurbulence.delete(ball);
                ball.remove();
            }
        }

        // ---------- SOCKET HANDLERS ----------
        socket.on('connect', () => {
            document.getElementById('status-text').innerText = 'CONNECTED';
            socket.emit('keno:auth', { userId, userName });
        });

        socket.on('keno:welcome', (data) => {
            balance = data.balance || 1000;
            updateBalance(balance);
            currentRound = data.currentRound || 1;
            roundSpan.innerText = currentRound;
            roundActive = data.isRoundActive || false;
            updateCountdown(data.countdown || 30);
            if (data.currentDrawnNumbers?.length > 0) {
                bettingPhase.classList.add('hidden');
                spherePhase.classList.add('active');
                resetSphere();
                data.currentDrawnNumbers.forEach(n => removeNumberBall(n));
                displayAllDrawnNumbers(data.currentDrawnNumbers);
                if (!data.isDrawComplete) {
                    sphereGlass.classList.add('spinning');
                    startTurbulence();
                }
            }

            // ---------- ASK SOUND PREFERENCE ON FIRST WELCOME ----------
            askSoundPreference();
        });

        socket.on('keno:round_start', (d) => {
            spherePhase.classList.remove('active');
            bettingPhase.classList.remove('hidden');
            roundActive = true;
            hasPlacedBet = false;
            currentRound = d.round;
            roundSpan.innerText = currentRound;
            updateCountdown(d.duration || 30);
            clearAllSelections();
            playBtn.innerText = 'PLACE BET';
            waitingMsg.style.display = 'none';
            if (turbulenceInterval) {
                cancelAnimationFrame(turbulenceInterval);
                turbulenceInterval = null;
            }
        });

        socket.on('keno:countdown_update', (d) => updateCountdown(d.countdown));

        socket.on('keno:draw_start', () => {
            bettingPhase.classList.add('hidden');
            spherePhase.classList.add('active');
            resetSphere();
            sphereGlass.classList.add('spinning');
            startTurbulence();
        });

        socket.on('keno:number_drawn', (d) => {
            speakNumber(d.number);
            // Use smooth flight if ball exists, otherwise just add directly
            if (document.querySelector(`.mini-ball[data-number="${d.number}"]`)) {
                flyBallToRow(d.number);
            } else {
                addDrawnBallDirect(d.number);
            }
        });

        socket.on('keno:round_results', (d) => {
            sphereGlass.classList.remove('spinning');
            if (d.drawnNumbers && d.drawnNumbers.length !== drawnNumbersSoFar.length) {
                displayAllDrawnNumbers(d.drawnNumbers);
            }
            totalBallsSpan.innerText = d.totalDrawn || 20;
            scheduleReturnToBetting();
        });

        socket.on('keno:round_result', (d) => {
            if (returnTimeout) clearTimeout(returnTimeout);
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<span>R#${d.round}</span><span style="color:${d.winnings>0?'gold':'#888'}">${d.winnings>0?'+'+d.winnings:'-'+d.bet}</span>`;
            historyList.prepend(item);
            if (historyList.children.length > 5) historyList.lastChild.remove();
            if (d.winnings > 0) updateBalance(d.newBalance);

            showResultAndReturnToBetting(d.winnings > 0, d.winnings, d.bet);
        });

        socket.on('keno:betConfirmed', (d) => {
            hasPlacedBet = true;
            updateBalance(d.balance);
            playBtn.disabled = true;
            playBtn.innerText = '✔️ BET IN';
        });

        socket.on('keno:players_update', (d) => {
            waitingMsg.style.display = d.count === 0 ? 'block' : 'none';
        });

        socket.on('keno:balance', (d) => updateBalance(d.balance));

        // Replace alerts with system message
        socket.on('keno:error', (msg) => {
            const text = typeof msg === 'string' ? msg : JSON.stringify(msg);
            showSystemMessage(text, 'error');
        });
        socket.on('keno:warning', (msg) => {
            const text = typeof msg === 'string' ? msg : JSON.stringify(msg);
            showSystemMessage(text, 'info');
        });

        socket.on('keno:draw_state', (d) => {
            bettingPhase.classList.add('hidden');
            spherePhase.classList.add('active');
            resetSphere();
            if (d.drawnNumbers) {
                d.drawnNumbers.forEach(n => removeNumberBall(n));
                displayAllDrawnNumbers(d.drawnNumbers);
            }
            if (!d.isDrawComplete) {
                sphereGlass.classList.add('spinning');
                startTurbulence();
            }
        });

        // initial reset
        resetSphere();
    })();
</script>
</body>
</html>
