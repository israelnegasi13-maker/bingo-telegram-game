<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Slots Galaxy · ETHIO GAMES</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
      background: #0b0e14;
      color: #f0f4fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .game-container {
      max-width: 420px;
      width: 100%;
      background: #1a1f2c;
      border: 1px solid #2f3747;
      border-radius: 40px;
      padding: 24px 16px 32px;
      box-shadow: 0 25px 40px rgba(0,0,0,0.8);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #c0c7ff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo span { color: #8b5cf6; background: none; -webkit-text-fill-color: #8b5cf6; }

    .balance-box {
      background: #252d3b;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 18px;
      border: 1px solid #4b5563;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
    }
    .balance-box span { color: #fbbf24; margin-right: 6px; }

    /* Reels – 3D recessed look */
    .reels {
      background: #111827;
      border-radius: 30px;
      padding: 20px 12px;
      margin: 20px 0 16px;
      border: 1px solid #374151;
      box-shadow: inset 0 0 15px #00000066, 0 10px 15px -5px #00000080;
    }

    .reel-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      aspect-ratio: 1 / 1;
    }

    .symbol-cell {
      background: #1e293b;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      box-shadow: 
        inset 0 -4px 0 #0f172a,
        inset 0 0 0 2px #4b5563,
        0 5px 0 #0b0f17;
      transition: transform 0.05s, box-shadow 0.1s;
      text-shadow: 0 2px 5px black;
    }

    /* No global spinning class – we control via JS */

    .paylines-info {
      text-align: center;
      font-size: 14px;
      color: #9ca3af;
      margin: 10px 0 20px;
      background: #1e293b80;
      padding: 8px;
      border-radius: 30px;
      backdrop-filter: blur(4px);
    }
    .paylines-info strong {
      color: #fbbf24;
      font-weight: 600;
    }

    .bet-panel {
      background: #252d3b;
      border-radius: 28px;
      padding: 18px;
      margin: 20px 0;
      border: 1px solid #3f4a5a;
    }

    .bet-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .bet-label span {
      color: #b0c0d0;
      font-size: 15px;
    }
    .bet-amount {
      font-size: 28px;
      font-weight: 700;
      color: #fbbf24;
      text-shadow: 0 0 8px #fbbf2480;
    }

    .bet-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .bet-option {
      background: #1f2a37;
      border: 1px solid #4b5563;
      border-radius: 40px;
      padding: 10px 18px;
      font-weight: 700;
      font-size: 16px;
      color: #d1d5db;
      cursor: pointer;
      transition: all 0.15s;
      flex: 1 0 auto;
      max-width: 70px;
      box-shadow: 0 3px 0 #0f172a;
    }
    .bet-option.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
      box-shadow: 0 0 15px #3b82f6, 0 3px 0 #1e3a8a;
    }

    .spin-btn {
      width: 100%;
      background: linear-gradient(145deg, #f97316, #dc2626);
      border: none;
      border-radius: 60px;
      padding: 20px;
      font-size: 24px;
      font-weight: 800;
      color: white;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin: 12px 0 8px;
      cursor: pointer;
      transition: all 0.08s linear;
      box-shadow: 0 10px 0 #b91c1c;
      border: 1px solid #fca5a5;
    }
    .spin-btn:active {
      transform: translateY(5px);
      box-shadow: 0 5px 0 #b91c1c;
    }
    .spin-btn:disabled {
      opacity: 0.6;
      filter: grayscale(0.4);
      pointer-events: none;
      transform: translateY(4px);
      box-shadow: 0 6px 0 #b91c1c;
    }

    .result-message {
      text-align: center;
      min-height: 36px;
      font-weight: 700;
      font-size: 18px;
      margin: 12px 0 0;
      color: #fbbf24;
      text-shadow: 0 0 5px #fbbf24;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-top: 24px;
      font-size: 15px;
    }
    .footer-links a {
      color: #a0b3cc;
      text-decoration: none;
      font-weight: 500;
      padding: 6px 12px;
      background: #1e293b;
      border-radius: 30px;
      border: 1px solid #3a4a5e;
    }

    /* Modal (unchanged) */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-content {
      background: #1f2a37;
      border: 1px solid #4b5563;
      border-radius: 32px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 30px 40px black;
    }
    .modal-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #fbbf24;
    }
    .modal-stats {
      background: #111827;
      padding: 20px;
      border-radius: 20px;
      margin: 16px 0;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 16px;
    }
    .close-btn {
      background: #3b82f6;
      border: none;
      border-radius: 40px;
      padding: 14px 30px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="header">
      <div class="logo">🌌 SLOTS <span>GALAXY</span></div>
      <div class="balance-box"><span>💰</span><span id="balance">0.00</span></div>
    </div>

    <!-- Reels -->
    <div class="reels" id="reelsContainer">
      <div class="reel-grid" id="reelGrid">
        <!-- filled by JS -->
      </div>
    </div>

    <div class="paylines-info">
      <strong>5 Paylines</strong> · 3 rows · 2 diagonals
    </div>

    <!-- Bet panel -->
    <div class="bet-panel">
      <div class="bet-label">
        <span>Bet amount</span>
        <span class="bet-amount" id="betAmount">5</span>
      </div>
      <div class="bet-options" id="betOptions">
        <button class="bet-option active" data-bet="5">5</button>
        <button class="bet-option" data-bet="10">10</button>
        <button class="bet-option" data-bet="20">20</button>
        <button class="bet-option" data-bet="50">50</button>
        <button class="bet-option" data-bet="100">100</button>
      </div>
    </div>

    <!-- Spin button -->
    <button class="spin-btn" id="spinBtn">🚀 SPIN</button>
    <div class="result-message" id="resultMessage"></div>

    <!-- Footer -->
    <div class="footer-links">
      <a href="#" onclick="window.history.back()">⬅️ Back</a>
      <a href="#" onclick="showStats()">📊 Stats</a>
      <a href="#" onclick="window.location.href='/telegram'">🏠 Home</a>
    </div>
  </div>

  <!-- Stats Modal -->
  <div class="modal" id="statsModal">
    <div class="modal-content">
      <div class="modal-title">✨ SLOTS STATS</div>
      <div class="modal-stats">
        <div class="stat-row"><span>Total games</span> <span id="statGames">0</span></div>
        <div class="stat-row"><span>Total wagered</span> <span id="statWagered">0 ETB</span></div>
        <div class="stat-row"><span>Total payouts</span> <span id="statPayouts">0 ETB</span></div>
        <div class="stat-row"><span>House edge</span> <span id="statHouse">0%</span></div>
      </div>
      <button class="close-btn" onclick="closeStats()">Close</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    (function() {
      const socket = io();
      let currentUserId = null;
      let userName = 'Player';
      let balance = 0;
      let currentBet = 5;
      let spinning = false;

      // ---------- get userId from URL ----------
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get('userId');
      const name = urlParams.get('name');
      if (userId) {
        currentUserId = userId;
        userName = name || 'Player';
        socket.emit('init', { userId, userName });
      } else {
        alert('Missing user data. Please login via /telegram');
        window.location.href = '/telegram';
      }

      // ---------- DOM elements ----------
      const reelGrid = document.getElementById('reelGrid');
      const balanceSpan = document.getElementById('balance');
      const betAmountSpan = document.getElementById('betAmount');
      const spinBtn = document.getElementById('spinBtn');
      const resultMsg = document.getElementById('resultMessage');
      const betOptions = document.querySelectorAll('.bet-option');
      const reelsContainer = document.getElementById('reelsContainer');

      // ---------- symbols (must match backend order) ----------
      const SYMBOLS = ['🌌', '🌠', '🪐', '👽', '🚀', '🌟', '☄️', '👾'];

      // initialize reels with random symbols
      function initReels() {
        let html = '';
        for (let i = 0; i < 9; i++) {
          const randomIdx = Math.floor(Math.random() * SYMBOLS.length);
          html += `<div class="symbol-cell">${SYMBOLS[randomIdx]}</div>`;
        }
        reelGrid.innerHTML = html;
      }
      initReels();

      // update reels with given indices (array of 9 numbers)
      function setReelsFromIndices(indices) {
        const cells = document.querySelectorAll('.symbol-cell');
        indices.forEach((idx, pos) => {
          cells[pos].textContent = SYMBOLS[idx];
        });
      }

      // ---------- rolling animation variables ----------
      let spinInterval = null;
      let finalIndices = null;
      let spinStartTime = 0;
      const MIN_SPIN_MS = 1000; // at least 1 sec of spinning
      const COLUMN_STOP_DELAY = 180; // ms between column stops

      // start spinning – all cells change rapidly
      function startRolling() {
        if (spinInterval) clearInterval(spinInterval);
        spinInterval = setInterval(() => {
          const cells = document.querySelectorAll('.symbol-cell');
          for (let i = 0; i < cells.length; i++) {
            const randomIdx = Math.floor(Math.random() * SYMBOLS.length);
            cells[i].textContent = SYMBOLS[randomIdx];
          }
        }, 60); // 60ms per frame = smooth rolling
      }

      // stop columns one by one
      function stopColumns(colIndex, finalIndices) {
        if (colIndex >= 3) {
          // all columns stopped
          spinning = false;
          spinBtn.disabled = false;
          return;
        }

        setTimeout(() => {
          const cells = document.querySelectorAll('.symbol-cell');
          // column indices: 0->0,3,6 ; 1->1,4,7 ; 2->2,5,8
          const pos1 = colIndex;
          const pos2 = colIndex + 3;
          const pos3 = colIndex + 6;
          cells[pos1].textContent = SYMBOLS[finalIndices[pos1]];
          cells[pos2].textContent = SYMBOLS[finalIndices[pos2]];
          cells[pos3].textContent = SYMBOLS[finalIndices[pos3]];

          // move to next column
          stopColumns(colIndex + 1, finalIndices);
        }, colIndex === 0 ? 0 : COLUMN_STOP_DELAY); // first column stops immediately
      }

      // update balance display
      function updateBalance(newBalance) {
        balance = newBalance;
        balanceSpan.textContent = balance.toFixed(2);
      }

      // bet selection
      betOptions.forEach(opt => {
        opt.addEventListener('click', () => {
          betOptions.forEach(o => o.classList.remove('active'));
          opt.classList.add('active');
          currentBet = parseInt(opt.dataset.bet, 10);
          betAmountSpan.textContent = currentBet;
        });
      });

      // ---------- spin action ----------
      spinBtn.addEventListener('click', () => {
        if (spinning) return;
        if (!currentUserId) return;
        if (balance < currentBet) {
          resultMsg.textContent = '❌ Insufficient balance';
          return;
        }

        spinning = true;
        spinBtn.disabled = true;
        resultMsg.textContent = 'rolling...';

        // start the visual roll immediately
        spinStartTime = Date.now();
        startRolling();

        // request server spin
        socket.emit('slots:spin', {
          userId: currentUserId,
          bet: currentBet
        });
      });

      // ---------- socket events ----------
      socket.on('initSuccess', (data) => {
        updateBalance(data.balance);
      });

      socket.on('balanceUpdate', (newBal) => {
        updateBalance(newBal);
      });

      socket.on('slots:spinResult', (data) => {
        // data.symbols is array of indices (0-7)
        finalIndices = data.symbols;

        const elapsed = Date.now() - spinStartTime;
        const remaining = Math.max(0, MIN_SPIN_MS - elapsed);

        setTimeout(() => {
          // stop the rapid rolling
          if (spinInterval) {
            clearInterval(spinInterval);
            spinInterval = null;
          }

          // begin sequential column stop
          stopColumns(0, finalIndices);

          // update balance and win message after all columns stopped?
          // We'll set a timeout for the approximate duration of stops
          const totalStopDuration = 2 * COLUMN_STOP_DELAY; // after last column starts
          setTimeout(() => {
            updateBalance(data.newBalance);
            if (data.winAmount > 0) {
              resultMsg.textContent = `🎉 YOU WON ${data.winAmount} ETB! (x${data.multiplier.toFixed(2)})`;
            } else {
              resultMsg.textContent = '😞 Try again!';
            }
          }, totalStopDuration + 50);
        }, remaining);
      });

      socket.on('slots:error', (err) => {
        // stop animation and re-enable
        if (spinInterval) {
          clearInterval(spinInterval);
          spinInterval = null;
        }
        spinning = false;
        spinBtn.disabled = false;
        resultMsg.textContent = err;
      });

      // refresh balance periodically
      setInterval(() => {
        if (currentUserId) {
          socket.emit('getUserData', { userId: currentUserId });
        }
      }, 10000);

      // ---------- stats modal ----------
      window.showStats = function() {
        socket.emit('slots:getStats');
        document.getElementById('statsModal').style.display = 'flex';
      };
      window.closeStats = function() {
        document.getElementById('statsModal').style.display = 'none';
      };

      socket.on('slots:stats', (stats) => {
        document.getElementById('statGames').textContent = stats.totalGames || 0;
        document.getElementById('statWagered').textContent = (stats.totalWagered || 0).toFixed(2) + ' ETB';
        document.getElementById('statPayouts').textContent = (stats.totalPayouts || 0).toFixed(2) + ' ETB';
        const house = stats.totalWagered > 0 
          ? ((stats.totalWagered - stats.totalPayouts) / stats.totalWagered * 100).toFixed(2)
          : 0;
        document.getElementById('statHouse').textContent = house + '%';
      });

      // close modal on outside click
      window.onclick = (e) => {
        if (e.target === document.getElementById('statsModal')) closeStats();
      };
    })();
  </script>
</body>
</html>
